name: Build unsigned IPA

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      HAS_SIGNING_SECRETS: ${{ secrets.SIGNING_P12_BASE64 != '' && secrets.SIGNING_PROFILE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Test LucidCore
        working-directory: Packages/LucidCore
        run: swift test

      - name: Build app (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project LucidDash.xcodeproj \
            -scheme LucidDash \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E "error:|warning: .*LucidDash|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/LucidDash.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LucidDash.app Payload/
          # Ad-hoc sign so the binary carries an LC_CODE_SIGNATURE slot and
          # _CodeSignature/CodeResources. On-device re-signers (ESign, Scarlet,
          # Feather, zsign) replace this signature but need the slot to exist;
          # without it the install fails with "integrity could not be verified".
          xattr -cr Payload/LucidDash.app
          codesign --force --sign - --timestamp=none --generate-entitlement-der Payload/LucidDash.app
          codesign --verify --verbose=2 Payload/LucidDash.app
          otool -l Payload/LucidDash.app/LucidDash | grep -q LC_CODE_SIGNATURE
          test -f Payload/LucidDash.app/_CodeSignature/CodeResources
          zip -qry LucidDash-unsigned.ipa Payload
          ls -lh LucidDash-unsigned.ipa

      - name: Sign with your certificate (optional)
        # Runs only when the repository has these secrets:
        #   SIGNING_P12_BASE64        base64 of your .p12 certificate
        #   SIGNING_P12_PASSWORD      its password (can be empty)
        #   SIGNING_PROFILE_BASE64    base64 of your .mobileprovision
        env:
          P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.SIGNING_PROFILE_BASE64 }}
        if: env.HAS_SIGNING_SECRETS == 'true'
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/sign"
          mkdir -p "$WORK"
          echo "$P12_BASE64" | base64 --decode > "$WORK/cert.p12"
          echo "$PROFILE_BASE64" | base64 --decode > "$WORK/profile.mobileprovision"

          KEYCHAIN="$WORK/signing.keychain-db"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import "$WORK/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk 'NR==1{print $2}')
          test -n "$IDENTITY" || { echo "::error::No signing identity found in the .p12"; exit 1; }
          security find-identity -v -p codesigning "$KEYCHAIN"

          security cms -D -i "$WORK/profile.mobileprovision" > "$WORK/profile.plist"
          /usr/libexec/PlistBuddy -x -c "Print :Entitlements" "$WORK/profile.plist" > "$WORK/entitlements.plist"
          TEAM=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$WORK/profile.plist")
          APPID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$WORK/profile.plist")
          echo "Profile: $(/usr/libexec/PlistBuddy -c 'Print :Name' "$WORK/profile.plist"), team $TEAM, app id $APPID, expires $(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$WORK/profile.plist")"

          rm -rf SignedPayload && mkdir SignedPayload
          cp -R Payload/LucidDash.app SignedPayload/
          APP=SignedPayload/LucidDash.app
          BUNDLE_ID="${APPID#"$TEAM".}"
          if [[ "$BUNDLE_ID" == *"*"* ]]; then
            # Wildcard profile: keep our bundle ID and spell it out in the entitlements.
            BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          else
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "$APP/Info.plist"
          fi
          /usr/libexec/PlistBuddy -c "Set :application-identifier $TEAM.$BUNDLE_ID" "$WORK/entitlements.plist"
          echo "Signing as bundle ID $BUNDLE_ID"

          cp "$WORK/profile.mobileprovision" "$APP/embedded.mobileprovision"
          codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" \
            --entitlements "$WORK/entitlements.plist" --generate-entitlement-der --timestamp=none "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          codesign -d --entitlements - "$APP"

          rm -rf Payload-signed && mkdir Payload-signed && mv SignedPayload Payload-signed/Payload
          (cd Payload-signed && zip -qry ../LucidDash-signed.ipa Payload)
          ls -lh LucidDash-signed.ipa
          security delete-keychain "$KEYCHAIN"
          rm -rf "$WORK"

      - name: Upload signed IPA (private, 7 days)
        if: hashFiles('LucidDash-signed.ipa') != ''
        uses: actions/upload-artifact@v4
        with:
          name: LucidDash-signed-ipa
          path: LucidDash-signed.ipa
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: LucidDash-unsigned-ipa
          path: LucidDash-unsigned.ipa

      - name: Publish to a GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" LucidDash-unsigned.ipa \
            --target "$GITHUB_SHA" \
            --title "LucidDash build ${GITHUB_RUN_NUMBER} (ready to sign)" \
            --notes "Ad-hoc signed IPA built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Sign it with your own certificate before installing." \
            --prerelease

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
